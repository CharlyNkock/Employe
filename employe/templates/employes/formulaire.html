{% extends 'employes/base.html' %}
{% block content %}
  <form method="post" class="space-y-4">
    {% csrf_token %}
    {{ form.non_field_errors }}
    {{ form.nom }}
    {{ form.prenom }}
    {{ form.email }}
    {{ form.poste }}
    {{ form.salaire }}
    <button class="btn btn-primary" type="submit">Enregistrer</button>
  </form>
{% endblock %}
